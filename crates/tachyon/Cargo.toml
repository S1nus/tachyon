[package]
categories = [
    "cryptography::cryptocurrencies",
]
description = """
WIP
"""
keywords = [
    "zcash",
    "tachyon",
]
name = "zcash_tachyon"
version = "0.0.0"

documentation = "https://docs.rs/zcash_tachyon"
readme = "README.md"
repository = "https://github.com/tachyon-zcash/tachyon"

edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = [
    "std",
]
std = [
    "blake2b_simd/std",
    "ragu/std",
    "reddsa/std",
    "corez/std",
    "ragu/multicore",
]
test-epoch-size = [
]

[lints]
workspace = true

[dependencies]
blake2b_simd = { version = "1.0", default-features = false }
corez = { version = "0.1.1", default-features = false, features = [
    "alloc",
] }
derive_more = { version = "~2.1", default-features = false, features = [
    "full", # todo: use more specific features
] }
ff = { version = "0.14", default-features = false }
group = { version = "0.14", default-features = false }
lazy_static = "1.5.0"
pasta_curves = { package = "zakura-pasta-curves", version = "1.0.0-rc.2", features = [
    "deferred",
] }
ragu = { git = "https://github.com/tachyon-zcash/ragu", rev = "f4f6315b10ed96944c40b2bbdbca0fe06af66ce0", default-features = false, features = [
    "mock",
] }
rand_core = { version = "0.10", default-features = false }
reddsa = { version = "1.0.0-rc.2", package = "zakura-reddsa" }

[dev-dependencies]
rand = { version = "0.10", default-features = false, features = [
    "std_rng",
] }

[lib]
bench = false
